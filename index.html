<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f4" />
    <meta name="description" content="Athera Talks — private messages and voice calls. Created by Taha Ahsan." />
    <meta name="application-name" content="Athera Talks" />
    <meta property="og:title" content="Athera Talks" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Athera Talks</title>
    <script>
      try {
        var themes = ['dark','naruto','midnight','sakura','ocean','forest','light','amoled','blush','lavender','peach','rosegold','cotton','mint','blossom','coquette']
        var savedTheme = localStorage.getItem('tatalk:theme')
        document.documentElement.setAttribute('data-theme', themes.indexOf(savedTheme) >= 0 ? savedTheme : 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
