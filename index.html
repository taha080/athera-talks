<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09080f" />
    <meta
      name="description"
      content="Athera Talks — real-time chat and voice calls for anime fans. Created by Taha Ahsan."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="application-name" content="Athera Talks" />
    <title>Athera Talks</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('tatalk:theme')
        document.documentElement.setAttribute('data-theme', savedTheme === 'naruto' ? 'naruto' : 'dark')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
